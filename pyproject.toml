[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macsign"
description = "Sign, notarise, staple and package macOS apps"
readme = "README.md"
# The version that comes with Xcode.
requires-python = ">=3.9"
dynamic = ["version"]

[project.scripts]
macsign = "macsign:main"

[tool.hatch.version]
path = "macsign.py"

[tool.hatch.build.targets.wheel]
only-include = ["macsign.py"]

[tool.hatch.build.targets.sdist]
only-include = ["macsign.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.9"
